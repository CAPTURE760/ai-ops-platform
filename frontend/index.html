<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Ops Platform</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #060a13;
      color: #e2e8f0;
      font-family: 'Inter', -apple-system, sans-serif;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Animated background */
    body::before {
      content: '';
      position: fixed;
      top: -50%; left: -50%;
      width: 200%; height: 200%;
      background: radial-gradient(circle at 20% 50%, #0ea5e920 0%, transparent 40%),
                  radial-gradient(circle at 80% 20%, #8b5cf620 0%, transparent 40%),
                  radial-gradient(circle at 50% 80%, #06b6d415 0%, transparent 40%);
      animation: bgMove 20s ease-in-out infinite;
      z-index: -1;
    }
    @keyframes bgMove {
      0%, 100% { transform: translate(0, 0); }
      33% { transform: translate(-2%, 1%); }
      66% { transform: translate(1%, -2%); }
    }

    /* Header */
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 32px;
      background: rgba(17, 24, 39, 0.8);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid rgba(255,255,255,0.06);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .header h1 {
      font-size: 20px;
      font-weight: 700;
      background: linear-gradient(135deg, #38bdf8, #818cf8, #c084fc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header h1 .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #22c55e; display: inline-block;
      animation: pulse 2s infinite;
      box-shadow: 0 0 8px #22c55e80;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; box-shadow: 0 0 8px #22c55e80; }
      50% { opacity: 0.5; box-shadow: 0 0 16px #22c55e60; }
    }
    .header-right {
      display: flex;
      align-items: center;
      gap: 20px;
    }
    .header .time {
      font-size: 13px;
      color: #64748b;
      font-family: 'JetBrains Mono', monospace;
    }
    .last-update {
      font-size: 11px;
      color: #475569;
      padding: 4px 10px;
      background: rgba(255,255,255,0.03);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    /* Error banner */
    .error-banner {
      display: none;
      background: linear-gradient(90deg, #7f1d1d, #991b1b);
      color: #fecaca;
      padding: 10px 32px;
      font-size: 13px;
      text-align: center;
      backdrop-filter: blur(10px);
    }
    .error-banner button {
      margin-left: 16px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(254,202,202,0.3);
      color: #fecaca;
      padding: 2px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      transition: background 0.2s;
    }
    .error-banner button:hover { background: rgba(255,255,255,0.2); }

    /* Dashboard grid */
    .dashboard {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
      padding: 24px 32px;
      max-width: 1500px;
      margin: 0 auto;
    }

    /* Glass cards */
    .card {
      background: rgba(17, 24, 39, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 24px;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }
    .card:hover {
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .card-title {
      font-size: 12px;
      font-weight: 600;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .card-title .icon {
      width: 20px; height: 20px;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
    }

    /* Gauges Row */
    .gauges-row {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }
    .gauge-card {
      background: rgba(17, 24, 39, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 32px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: all 0.3s ease;
      position: relative;
      overflow: hidden;
    }
    .gauge-card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
    }
    .gauge-card:hover {
      border-color: rgba(255,255,255,0.12);
      transform: translateY(-2px);
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .gauge-wrap {
      position: relative;
      width: 150px;
      height: 150px;
    }
    .gauge-wrap svg {
      transform: rotate(-90deg);
      filter: drop-shadow(0 0 8px rgba(59, 130, 246, 0.3));
    }
    .gauge-bg {
      fill: none;
      stroke: rgba(255,255,255,0.05);
      stroke-width: 12;
    }
    .gauge-fg {
      fill: none;
      stroke-width: 12;
      stroke-linecap: round;
      transition: stroke-dashoffset 0.8s cubic-bezier(0.4, 0, 0.2, 1), stroke 0.4s;
    }
    .gauge-value {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 36px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    .gauge-unit {
      font-size: 16px;
      color: #64748b;
      font-weight: 400;
    }
    .gauge-label {
      margin-top: 16px;
      font-size: 15px;
      color: #94a3b8;
      font-weight: 600;
      letter-spacing: 0.5px;
    }
    .gauge-sub {
      margin-top: 6px;
      font-size: 12px;
      color: #475569;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Gauge colors with glow */
    .color-normal { stroke: #3b82f6; color: #3b82f6; filter: drop-shadow(0 0 6px #3b82f640); }
    .color-warning { stroke: #f59e0b; color: #f59e0b; filter: drop-shadow(0 0 6px #f59e0b40); }
    .color-danger { stroke: #ef4444; color: #ef4444; filter: drop-shadow(0 0 6px #ef444440); }

    /* Chart */
    .chart-card { grid-column: 1 / -1; }
    .chart-container {
      position: relative;
      height: 240px;
    }

    /* Network */
    .net-stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }
    .net-item {
      background: rgba(15, 23, 42, 0.6);
      border-radius: 12px;
      padding: 20px;
      text-align: center;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.3s;
    }
    .net-item:hover {
      border-color: rgba(255,255,255,0.08);
      background: rgba(15, 23, 42, 0.8);
    }
    .net-item .net-label {
      font-size: 11px;
      color: #64748b;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      font-weight: 500;
    }
    .net-item .net-value {
      font-size: 28px;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }
    .net-item .net-unit {
      font-size: 12px;
      color: #475569;
      margin-top: 4px;
    }
    .net-up { color: #22c55e; }
    .net-down { color: #3b82f6; }
    .net-totals {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-top: 16px;
    }

    /* Docker containers */
    .container-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 320px;
      overflow-y: auto;
    }
    .container-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      background: rgba(15, 23, 42, 0.6);
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.04);
      transition: all 0.2s;
    }
    .container-item:hover {
      background: rgba(15, 23, 42, 0.8);
      border-color: rgba(255,255,255,0.08);
    }
    .container-status {
      width: 10px; height: 10px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-running { background: #22c55e; box-shadow: 0 0 10px #22c55e60; animation: statusPulse 2s infinite; }
    .status-exited { background: #ef4444; box-shadow: 0 0 6px #ef444440; }
    .status-paused { background: #f59e0b; box-shadow: 0 0 6px #f59e0b40; }
    .status-other { background: #64748b; }
    @keyframes statusPulse {
      0%, 100% { box-shadow: 0 0 10px #22c55e60; }
      50% { box-shadow: 0 0 18px #22c55e40; }
    }
    .container-name {
      font-size: 14px;
      font-weight: 500;
      color: #e2e8f0;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-family: 'JetBrains Mono', monospace;
    }
    .container-image {
      font-size: 12px;
      color: #64748b;
      max-width: 160px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .container-status-text {
      font-size: 11px;
      padding: 3px 10px;
      border-radius: 20px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .text-running { background: rgba(34,197,94,0.15); color: #22c55e; }
    .text-exited { background: rgba(239,68,68,0.15); color: #ef4444; }
    .text-paused { background: rgba(245,158,11,0.15); color: #f59e0b; }
    .text-other { background: rgba(100,116,139,0.15); color: #64748b; }

    /* Container actions */
    .container-actions {
      display: flex;
      gap: 4px;
      margin-left: 8px;
    }
    .btn-icon {
      width: 28px; height: 28px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #94a3b8;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      transition: all 0.2s;
    }
    .btn-icon:hover {
      background: rgba(255,255,255,0.1);
      color: #e2e8f0;
      border-color: rgba(255,255,255,0.15);
    }
    .btn-icon.btn-start:hover { background: rgba(34,197,94,0.2); color: #22c55e; border-color: #22c55e40; }
    .btn-icon.btn-stop:hover { background: rgba(239,68,68,0.2); color: #ef4444; border-color: #ef444440; }
    .btn-icon.btn-restart:hover { background: rgba(245,158,11,0.2); color: #f59e0b; border-color: #f59e0b40; }
    .btn-icon.btn-logs:hover { background: rgba(59,130,246,0.2); color: #3b82f6; border-color: #3b82f640; }
    .btn-icon:disabled { opacity: 0.3; cursor: not-allowed; }

    /* Log modal */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(4px);
      z-index: 200;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 16px;
      width: 90%;
      max-width: 800px;
      max-height: 80vh;
      display: flex;
      flex-direction: column;
      animation: modalIn 0.2s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }
    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 24px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    .modal-header h3 {
      font-size: 16px;
      font-weight: 600;
      color: #e2e8f0;
    }
    .modal-close {
      width: 32px; height: 32px;
      border-radius: 8px;
      border: none;
      background: rgba(255,255,255,0.06);
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .modal-close:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
    .modal-body {
      padding: 16px 24px;
      overflow-y: auto;
      flex: 1;
    }
    .log-content {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      line-height: 1.6;
      color: #94a3b8;
      white-space: pre-wrap;
      word-break: break-all;
    }

    /* Alert bar */
    .alert-bar {
      display: none;
      padding: 10px 32px;
      font-size: 13px;
      text-align: center;
      animation: alertPulse 2s infinite;
    }
    .alert-bar.active { display: flex; align-items: center; justify-content: center; gap: 12px; }
    .alert-bar.alert-warn { background: rgba(245,158,11,0.15); color: #fbbf24; border-bottom: 1px solid rgba(245,158,11,0.3); }
    .alert-bar.alert-danger { background: rgba(239,68,68,0.15); color: #f87171; border-bottom: 1px solid rgba(239,68,68,0.3); }
    @keyframes alertPulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.85; }
    }
    .alert-icon { font-size: 16px; }
    .alert-text { flex: 1; }
    .alert-dismiss {
      background: none;
      border: 1px solid currentColor;
      color: inherit;
      padding: 2px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      opacity: 0.7;
      transition: opacity 0.2s;
    }
    .alert-dismiss:hover { opacity: 1; }

    /* Settings panel */
    .settings-btn {
      width: 36px; height: 36px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.04);
      color: #94a3b8;
      cursor: pointer;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .settings-btn:hover { background: rgba(255,255,255,0.1); color: #e2e8f0; }
    .settings-panel {
      display: none;
      position: absolute;
      top: 60px;
      right: 32px;
      background: #111827;
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      padding: 20px;
      z-index: 150;
      min-width: 240px;
      animation: modalIn 0.2s ease;
    }
    .settings-panel.active { display: block; }
    .settings-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }
    .settings-row:last-child { margin-bottom: 0; }
    .settings-label {
      font-size: 13px;
      color: #94a3b8;
    }
    .settings-input {
      width: 60px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 6px;
      color: #e2e8f0;
      padding: 4px 8px;
      font-size: 13px;
      text-align: center;
      font-family: 'JetBrains Mono', monospace;
    }
    .settings-input:focus {
      outline: none;
      border-color: #3b82f6;
    }

    /* Process table */
    .proc-table {
      width: 100%;
      border-collapse: collapse;
    }
    .proc-table th {
      text-align: left;
      font-size: 11px;
      color: #64748b;
      font-weight: 600;
      padding: 10px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .proc-table td {
      font-size: 13px;
      padding: 12px 12px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: #cbd5e1;
    }
    .proc-table tr { transition: background 0.2s; }
    .proc-table tr:hover { background: rgba(255,255,255,0.02); }
    .proc-table tr:last-child td { border-bottom: none; }
    .proc-bar {
      height: 6px;
      background: rgba(255,255,255,0.05);
      border-radius: 3px;
      overflow: hidden;
      min-width: 80px;
    }
    .proc-bar-inner {
      height: 100%;
      border-radius: 3px;
      transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Empty state */
    .empty {
      text-align: center;
      color: #475569;
      padding: 32px;
      font-size: 14px;
    }

    /* Loading spinner */
    .spinner {
      display: inline-block;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.1);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 28px;
      color: #475569;
      font-size: 13px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

    /* Responsive */
    @media (max-width: 1100px) {
      .dashboard { grid-template-columns: repeat(2, 1fr); padding: 16px; }
      .gauges-row { grid-template-columns: repeat(2, 1fr); }
    }
    @media (max-width: 700px) {
      .dashboard { grid-template-columns: 1fr; }
      .gauges-row { grid-template-columns: 1fr; }
      .header { padding: 12px 16px; }
      .header h1 { font-size: 16px; }
    }

    /* Animations */
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .card, .gauge-card {
      animation: fadeInUp 0.5s ease forwards;
    }
    .gauges-row .gauge-card:nth-child(1) { animation-delay: 0.05s; }
    .gauges-row .gauge-card:nth-child(2) { animation-delay: 0.1s; }
    .gauges-row .gauge-card:nth-child(3) { animation-delay: 0.15s; }
    .dashboard > .card:nth-child(2) { animation-delay: 0.2s; }
    .dashboard > .card:nth-child(3) { animation-delay: 0.25s; }
    .dashboard > .card:nth-child(4) { animation-delay: 0.3s; }
    .dashboard > .card:nth-child(5) { animation-delay: 0.35s; }
  </style>
</head>
<body>

<div class="header">
  <h1><span class="dot"></span> AI Ops Platform</h1>
  <div class="header-right">
    <span class="last-update" id="last-update">未更新</span>
    <div class="time" id="clock">--</div>
    <button class="settings-btn" onclick="toggleSettings()" title="告警设置">⚙</button>
  </div>
</div>

<div class="settings-panel" id="settings-panel">
  <div style="font-size:14px;font-weight:600;color:#e2e8f0;margin-bottom:16px">告警阈值 (%)</div>
  <div class="settings-row">
    <span class="settings-label">CPU</span>
    <input class="settings-input" type="number" id="threshold-cpu" value="80" min="1" max="100">
  </div>
  <div class="settings-row">
    <span class="settings-label">内存</span>
    <input class="settings-input" type="number" id="threshold-mem" value="80" min="1" max="100">
  </div>
  <div class="settings-row">
    <span class="settings-label">磁盘</span>
    <input class="settings-input" type="number" id="threshold-disk" value="90" min="1" max="100">
  </div>
</div>

<div class="alert-bar" id="alert-bar">
  <span class="alert-icon">⚠</span>
  <span class="alert-text" id="alert-text"></span>
  <button class="alert-dismiss" onclick="dismissAlert()">忽略</button>
</div>

<div class="error-banner" id="error-banner">
  <span id="error-text"></span>
  <button onclick="this.parentElement.style.display='none'">关闭</button>
</div>

<div class="dashboard">
  <!-- Gauges -->
  <div class="gauges-row">
    <div class="gauge-card">
      <div class="gauge-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="gauge-bg" cx="75" cy="75" r="62"/>
          <circle class="gauge-fg color-normal" id="cpu-gauge" cx="75" cy="75" r="62"
            stroke-dasharray="389.56" stroke-dashoffset="389.56"/>
        </svg>
        <div class="gauge-value color-normal" id="cpu-val">--</div>
      </div>
      <div class="gauge-label">CPU</div>
      <div class="gauge-sub" id="cpu-sub">-- cores</div>
    </div>
    <div class="gauge-card">
      <div class="gauge-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="gauge-bg" cx="75" cy="75" r="62"/>
          <circle class="gauge-fg color-normal" id="mem-gauge" cx="75" cy="75" r="62"
            stroke-dasharray="389.56" stroke-dashoffset="389.56"/>
        </svg>
        <div class="gauge-value color-normal" id="mem-val">--</div>
      </div>
      <div class="gauge-label">内存</div>
      <div class="gauge-sub" id="mem-sub">--</div>
    </div>
    <div class="gauge-card">
      <div class="gauge-wrap">
        <svg width="150" height="150" viewBox="0 0 150 150">
          <circle class="gauge-bg" cx="75" cy="75" r="62"/>
          <circle class="gauge-fg color-normal" id="disk-gauge" cx="75" cy="75" r="62"
            stroke-dasharray="389.56" stroke-dashoffset="389.56"/>
        </svg>
        <div class="gauge-value color-normal" id="disk-val">--</div>
      </div>
      <div class="gauge-label">磁盘</div>
      <div class="gauge-sub" id="disk-sub">--</div>
    </div>
  </div>

  <!-- Trend Chart -->
  <div class="card chart-card">
    <div class="card-title">
      <span class="icon" style="background:#3b82f620;color:#3b82f6">~</span>
      趋势监控
    </div>
    <div class="chart-container">
      <canvas id="trendChart"></canvas>
    </div>
  </div>

  <!-- Network -->
  <div class="card">
    <div class="card-title">
      <span class="icon" style="background:#22c55e20;color:#22c55e">N</span>
      网络流量
    </div>
    <div class="net-stats">
      <div class="net-item">
        <div class="net-label">上传速度</div>
        <div class="net-value net-up" id="net-up">--</div>
        <div class="net-unit">KB/s</div>
      </div>
      <div class="net-item">
        <div class="net-label">下载速度</div>
        <div class="net-value net-down" id="net-down">--</div>
        <div class="net-unit">KB/s</div>
      </div>
    </div>
    <div class="net-totals">
      <div class="net-item">
        <div class="net-label">累计上传</div>
        <div class="net-value net-up" id="net-total-up" style="font-size:16px">--</div>
      </div>
      <div class="net-item">
        <div class="net-label">累计下载</div>
        <div class="net-value net-down" id="net-total-down" style="font-size:16px">--</div>
      </div>
    </div>
  </div>

  <!-- Docker -->
  <div class="card">
    <div class="card-title">
      <span class="icon" style="background:#8b5cf620;color:#8b5cf6">D</span>
      Docker 容器
    </div>
    <div class="container-list" id="docker-list">
      <div class="loading"><span class="spinner"></span> 加载中...</div>
    </div>
  </div>

  <!-- Processes -->
  <div class="card">
    <div class="card-title">
      <span class="icon" style="background:#f59e0b20;color:#f59e0b">P</span>
      Top 5 进程 (CPU)
    </div>
    <table class="proc-table">
      <thead>
        <tr>
          <th>PID</th>
          <th>进程名</th>
          <th>CPU</th>
          <th>内存</th>
        </tr>
      </thead>
      <tbody id="proc-body">
        <tr><td colspan="4" class="loading"><span class="spinner"></span> 加载中...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Log Modal -->
<div class="modal-overlay" id="log-modal">
  <div class="modal">
    <div class="modal-header">
      <h3 id="log-title">容器日志</h3>
      <button class="modal-close" onclick="closeLogModal()">&times;</button>
    </div>
    <div class="modal-body">
      <pre class="log-content" id="log-content">加载中...</pre>
    </div>
  </div>
</div>

<script>
const API = window.APP_API_URL || (window.location.origin + '/api');
const C = 2 * Math.PI * 62; // ~389.56

// --- XSS protection ---
function esc(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// --- Error display ---
function showError(msg) {
  document.getElementById('error-text').textContent = msg;
  document.getElementById('error-banner').style.display = 'block';
  setTimeout(() => {
    document.getElementById('error-banner').style.display = 'none';
  }, 8000);
}

// --- Settings ---
function toggleSettings() {
  document.getElementById('settings-panel').classList.toggle('active');
}

// --- Alerts ---
let alertDismissed = false;

function checkAlerts(cpu, mem, disk) {
  const cpuT = parseInt(document.getElementById('threshold-cpu').value) || 80;
  const memT = parseInt(document.getElementById('threshold-mem').value) || 80;
  const diskT = parseInt(document.getElementById('threshold-disk').value) || 90;

  const alerts = [];
  if (cpu >= cpuT) alerts.push(`CPU ${Math.round(cpu)}% (阈值 ${cpuT}%)`);
  if (mem >= memT) alerts.push(`内存 ${Math.round(mem)}% (阈值 ${memT}%)`);
  if (disk >= diskT) alerts.push(`磁盘 ${Math.round(disk)}% (阈值 ${diskT}%)`);

  const bar = document.getElementById('alert-bar');
  const text = document.getElementById('alert-text');

  if (alerts.length > 0 && !alertDismissed) {
    text.textContent = '警告: ' + alerts.join(' | ');
    const isDanger = cpu >= 90 || mem >= 90 || disk >= 95;
    bar.className = 'alert-bar active ' + (isDanger ? 'alert-danger' : 'alert-warn');
    // Play alert sound
    if (!bar.dataset.alerted) {
      bar.dataset.alerted = 'true';
      try {
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.value = 800;
        gain.gain.value = 0.1;
        osc.start();
        setTimeout(() => { osc.stop(); audioCtx.close(); }, 200);
      } catch (e) {}
    }
  } else if (alerts.length === 0) {
    bar.className = 'alert-bar';
    bar.dataset.alerted = '';
    alertDismissed = false;
  }
}

function dismissAlert() {
  alertDismissed = true;
  document.getElementById('alert-bar').className = 'alert-bar';
}

// Close settings when clicking outside
document.addEventListener('click', function(e) {
  const panel = document.getElementById('settings-panel');
  const btn = document.querySelector('.settings-btn');
  if (panel.classList.contains('active') && !panel.contains(e.target) && !btn.contains(e.target)) {
    panel.classList.remove('active');
  }
});

// --- Chart setup ---
const ctx = document.getElementById('trendChart').getContext('2d');
const gradient1 = ctx.createLinearGradient(0, 0, 0, 240);
gradient1.addColorStop(0, 'rgba(59, 130, 246, 0.3)');
gradient1.addColorStop(1, 'rgba(59, 130, 246, 0)');
const gradient2 = ctx.createLinearGradient(0, 0, 0, 240);
gradient2.addColorStop(0, 'rgba(139, 92, 246, 0.3)');
gradient2.addColorStop(1, 'rgba(139, 92, 246, 0)');

const trendChart = new Chart(ctx, {
  type: 'line',
  data: {
    labels: [],
    datasets: [
      { label: 'CPU', data: [], borderColor: '#3b82f6', backgroundColor: gradient1, fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2.5 },
      { label: '内存', data: [], borderColor: '#8b5cf6', backgroundColor: gradient2, fill: true, tension: 0.4, pointRadius: 0, borderWidth: 2.5 },
    ]
  },
  options: {
    responsive: true,
    maintainAspectRatio: false,
    animation: { duration: 400 },
    scales: {
      x: { display: true, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#475569', maxTicksLimit: 10, font: { size: 10, family: 'JetBrains Mono' } } },
      y: { min: 0, max: 100, grid: { color: 'rgba(255,255,255,0.04)' }, ticks: { color: '#475569', callback: v => v + '%', font: { size: 10, family: 'JetBrains Mono' } } }
    },
    plugins: {
      legend: { labels: { color: '#94a3b8', usePointStyle: true, pointStyle: 'circle', padding: 20, font: { size: 12 } } },
      tooltip: {
        mode: 'index', intersect: false,
        backgroundColor: 'rgba(17, 24, 39, 0.9)',
        borderColor: 'rgba(255,255,255,0.1)',
        borderWidth: 1,
        titleFont: { family: 'JetBrains Mono', size: 11 },
        bodyFont: { family: 'JetBrains Mono', size: 12 },
        padding: 12,
        cornerRadius: 8,
      }
    },
    interaction: { mode: 'nearest', axis: 'x', intersect: false }
  }
});

// --- Helpers ---
function gaugeColor(val) {
  if (val >= 80) return 'color-danger';
  if (val >= 60) return 'color-warning';
  return 'color-normal';
}

function setGauge(id, val) {
  const fg = document.getElementById(id + '-gauge');
  const label = document.getElementById(id + '-val');
  const cls = gaugeColor(val);
  fg.className.baseVal = 'gauge-fg ' + cls;
  label.className = 'gauge-value ' + cls;
  fg.style.strokeDashoffset = C - (C * val / 100);
  label.textContent = Math.round(val);
}

function formatBytes(b) {
  if (b < 1024) return b.toFixed(0) + ' B';
  if (b < 1048576) return (b / 1024).toFixed(1) + ' KB';
  if (b < 1073741824) return (b / 1048576).toFixed(1) + ' MB';
  return (b / 1073741824).toFixed(2) + ' GB';
}

function formatSpeed(b) {
  if (b < 1024) return b.toFixed(0);
  if (b < 1048576) return (b / 1024).toFixed(1);
  return (b / 1048576).toFixed(2);
}

// --- Clock ---
function updateClock() {
  const now = new Date();
  document.getElementById('clock').textContent =
    now.toLocaleDateString('zh-CN') + ' ' + now.toLocaleTimeString('zh-CN');
}
setInterval(updateClock, 1000);
updateClock();

// --- Fetch System ---
async function fetchSystem() {
  try {
    const r = await fetch(API + '/system');
    const d = await r.json();
    setGauge('cpu', d.cpu);
    setGauge('mem', d.memory);
    setGauge('disk', d.disk);
    document.getElementById('cpu-sub').textContent = '使用率';
    document.getElementById('mem-sub').textContent = '使用率';
    document.getElementById('disk-sub').textContent = '使用率';
    document.getElementById('last-update').textContent = '更新于 ' + new Date().toLocaleTimeString('zh-CN');
    checkAlerts(d.cpu, d.memory, d.disk);
  } catch (e) {
    console.error('system', e);
    showError('系统数据加载失败，正在重试...');
  }
}

// --- Fetch Network ---
async function fetchNetwork() {
  try {
    const r = await fetch(API + '/network');
    const d = await r.json();
    document.getElementById('net-up').textContent = formatSpeed(d.sent_speed);
    document.getElementById('net-down').textContent = formatSpeed(d.recv_speed);
    document.getElementById('net-total-up').textContent = formatBytes(d.bytes_sent);
    document.getElementById('net-total-down').textContent = formatBytes(d.bytes_recv);
  } catch (e) {
    console.error('network', e);
    showError('网络数据加载失败');
  }
}

// --- Fetch Docker ---
async function fetchDocker() {
  try {
    const r = await fetch(API + '/docker');
    const d = await r.json();
    const el = document.getElementById('docker-list');
    if (!d.containers || d.containers.length === 0) {
      el.innerHTML = '<div class="empty">没有容器</div>';
      return;
    }
    el.innerHTML = d.containers.map(c => {
      const s = c.status;
      let cls = 'other';
      if (s === 'running') cls = 'running';
      else if (s === 'exited') cls = 'exited';
      else if (s === 'paused') cls = 'paused';
      const startBtn = s !== 'running' ? `<button class="btn-icon btn-start" title="启动" onclick="dockerAction('${c.id}','start')">▶</button>` : '';
      const stopBtn = s === 'running' ? `<button class="btn-icon btn-stop" title="停止" onclick="dockerAction('${c.id}','stop')">■</button>` : '';
      const restartBtn = s === 'running' ? `<button class="btn-icon btn-restart" title="重启" onclick="dockerAction('${c.id}','restart')">↻</button>` : '';
      return `<div class="container-item">
        <div class="container-status status-${cls}"></div>
        <div class="container-name">${esc(c.name)}</div>
        <div class="container-image">${esc(c.image)}</div>
        <div class="container-status-text text-${cls}">${esc(s)}</div>
        <div class="container-actions">
          ${startBtn}${stopBtn}${restartBtn}
          <button class="btn-icon btn-logs" title="日志" onclick="viewLogs('${c.id}','${esc(c.name)}')">📋</button>
        </div>
      </div>`;
    }).join('');
  } catch (e) {
    console.error('docker', e);
    showError('Docker 数据加载失败');
  }
}

// --- Docker Actions ---
async function dockerAction(id, action) {
  try {
    const r = await fetch(API + '/docker/' + id + '/' + action, { method: 'POST' });
    if (!r.ok) throw new Error('Action failed');
    setTimeout(fetchDocker, 1000);
  } catch (e) {
    console.error('docker action', e);
    showError('容器操作失败: ' + action);
  }
}

// --- View Logs ---
async function viewLogs(id, name) {
  document.getElementById('log-title').textContent = name + ' - 日志';
  document.getElementById('log-content').textContent = '加载中...';
  document.getElementById('log-modal').classList.add('active');
  try {
    const r = await fetch(API + '/docker/' + id + '/logs?tail=200');
    const d = await r.json();
    document.getElementById('log-content').textContent = d.logs || '暂无日志';
  } catch (e) {
    document.getElementById('log-content').textContent = '获取日志失败';
  }
}

function closeLogModal() {
  document.getElementById('log-modal').classList.remove('active');
}

document.getElementById('log-modal').addEventListener('click', function(e) {
  if (e.target === this) closeLogModal();
});

// --- Fetch Processes ---
async function fetchProcesses() {
  try {
    const r = await fetch(API + '/processes');
    const d = await r.json();
    const el = document.getElementById('proc-body');
    if (!d.processes || d.processes.length === 0) {
      el.innerHTML = '<tr><td colspan="4" class="empty">无数据</td></tr>';
      return;
    }
    el.innerHTML = d.processes.map(p => {
      const cpu = (p.cpu_percent || 0).toFixed(1);
      const mem = (p.memory_percent || 0).toFixed(1);
      const cpuColor = cpu > 50 ? '#ef4444' : cpu > 20 ? '#f59e0b' : '#3b82f6';
      const memColor = mem > 50 ? '#ef4444' : mem > 20 ? '#f59e0b' : '#8b5cf6';
      return `<tr>
        <td style="font-family:'JetBrains Mono',monospace;color:#64748b">${p.pid}</td>
        <td>${esc(p.name)}</td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="proc-bar"><div class="proc-bar-inner" style="width:${Math.min(cpu, 100)}%;background:${cpuColor}"></div></div>
            <span style="font-family:'JetBrains Mono',monospace;min-width:45px;font-size:12px">${cpu}%</span>
          </div>
        </td>
        <td>
          <div style="display:flex;align-items:center;gap:8px">
            <div class="proc-bar"><div class="proc-bar-inner" style="width:${Math.min(mem, 100)}%;background:${memColor}"></div></div>
            <span style="font-family:'JetBrains Mono',monospace;min-width:45px;font-size:12px">${mem}%</span>
          </div>
        </td>
      </tr>`;
    }).join('');
  } catch (e) {
    console.error('processes', e);
    showError('进程数据加载失败');
  }
}

// --- Fetch History ---
async function fetchHistory() {
  try {
    const r = await fetch(API + '/history');
    const d = await r.json();
    if (!d.history || d.history.length === 0) return;
    trendChart.data.labels = d.history.map(h => {
      const t = new Date(h.ts * 1000);
      return t.getHours().toString().padStart(2, '0') + ':' + t.getMinutes().toString().padStart(2, '0');
    });
    trendChart.data.datasets[0].data = d.history.map(h => h.cpu);
    trendChart.data.datasets[1].data = d.history.map(h => h.memory);
    trendChart.update('none');
  } catch (e) {
    console.error('history', e);
    showError('历史数据加载失败');
  }
}

// --- Polling ---
fetchSystem();
fetchNetwork();
fetchDocker();
fetchProcesses();
fetchHistory();

setInterval(fetchSystem, 3000);
setInterval(fetchNetwork, 3000);
setInterval(fetchDocker, 10000);
setInterval(fetchProcesses, 5000);
setInterval(fetchHistory, 30000);
</script>
</body>
</html>
